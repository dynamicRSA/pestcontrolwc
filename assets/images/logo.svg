<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- Brand Icon / Shield Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Gradient -->
    <defs>
      <linearGradient id="shieldGrad" x1="0" y1="0" x2="70" y2="70" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#15803d" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0" y1="0" x2="50" y2="50" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#84cc16" />
        <stop offset="100%" stop-color="#10b981" />
      </linearGradient>
      <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.25" />
      </filter>
    </defs>

    <!-- Shield Base -->
    <path d="M35 2 C52 2, 68 8, 68 8 C68 38, 54 58, 35 68 C16 58, 2 38, 2 8 C2 8, 18 2, 35 2 Z" 
          fill="url(#shieldGrad)" filter="url(#subtleGlow)" />

    <!-- Inner Shield Inset -->
    <path d="M35 7 C48 7, 62 12, 62 12 C62 36, 50 53, 35 62 C20 53, 8 36, 8 12 C8 12, 22 7, 35 7 Z" 
          fill="#064e3b" opacity="0.45" />

    <!-- Stylized Interlocking P & C Pest-Shield Crest -->
    <!-- 'P' Loop -->
    <path d="M22 20 L36 20 C42 20, 46 23, 46 29 C46 35, 42 38, 36 38 L29 38 L29 50 L22 50 Z" 
          fill="#ffffff" />
    <path d="M29 26 L35 26 C37 26, 39 27, 39 29 C39 31, 37 32, 35 32 L29 32 Z" 
          fill="#047857" />

    <!-- Eco Leaf / Target Accent Curve ('C' dynamic sweep) -->
    <path d="M46 26 C50 28, 53 32, 53 37 C53 45, 45 52, 35 52 C27 52, 21 47, 19 41 L25 39 C26 43, 30 46, 35 46 C41 46, 46 41, 46 37 C46 34, 44 32, 42 30 Z" 
          fill="url(#accentGrad)" />

    <!-- Mini Protective Star/Dot -->
    <circle cx="35" cy="14" r="2.5" fill="#84cc16" />
  </g>

  <!-- Typography -->
  <g transform="translate(92, 18)">
    <!-- Primary Name -->
    <text x="0" y="27" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="25" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
      PEST CONTROL <tspan fill="#15803d">PROS</tspan>
    </text>

    <!-- Subtitle / Location Badge -->
    <rect x="0" y="36" width="98" height="18" rx="4" fill="#047857" />
    <text x="49" y="48.5" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="700" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">
      WEST COAST
    </text>

    <text x="108" y="49" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="10.5" font-weight="600" letter-spacing="0.3" fill="#64748b">
      CERTIFIED FUMIGATION &amp; ECO PROTECTION
    </text>
  </g>
</svg>
